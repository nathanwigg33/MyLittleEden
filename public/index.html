<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Promise Land">
<meta name="theme-color" content="#2a1c14">
<meta name="description" content="My Little Promise Land: a cozy farming game in Bible-times Bethlehem.">
<title>My Little Promise Land</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><img class="badge" src="art/logo.jpg" alt=""><span>Loading…</span></div>

<!-- HUD -->
<div id="hud">
  <button id="btnMenu" class="pbtn" aria-label="Bag">🎒</button>
  <button id="btnMap" class="pbtn" aria-label="Map">🗺️</button>
  <div id="clock" class="wood">
    <div id="cDay"></div>
    <div id="cTime"></div>
    <div id="cMoneyRow"><span class="coin">₪</span><span id="cMoney"></span></div>
  </div>
  <div id="energy" class="wood" aria-label="Energy"><div id="eTrack"><div id="eFill"></div></div><span>E</span></div>
  <div id="notes"></div>
  <div id="hotbar" class="wood"></div>
  <button id="btnA" aria-label="Use"><img alt=""></button>
  <button id="btnB" aria-label="Switch tool">⇄</button>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="toasts"></div>
<div id="banner"></div>

<div id="dialog"><div class="paper"><div class="dhead"><canvas id="dPort" width="72" height="72"></canvas><div class="dname"></div></div><div class="dt"></div><div class="dch"></div></div></div>

<div id="menu"><div class="card paper">
  <div class="mhead"><div class="tabs"><div class="tab" data-tab="bag">Bag</div><div class="tab" data-tab="map">Map</div><div class="tab" data-tab="farm">Farm</div><div class="tab" data-tab="people">People</div><div class="tab" data-tab="book">Book</div><div class="tab" data-tab="opts">Options</div></div><button class="x">✕</button></div>
  <div class="mbody"></div>
</div></div>

<div id="binM"><div class="card paper">
  <div class="mhead"><div class="ttl">Shipping Bin</div><button class="x">✕</button></div>
  <div class="mbody"></div>
</div></div>

<div id="title">
  <div class="logo"><img class="badge" src="art/logo.jpg" alt="My Little Promise Land"><div class="l1">My Little</div><div class="l2">Promise Land</div><div class="l3">a farm outside Bethlehem</div></div>
  <div id="tbtns"></div>
  <div class="tip">On iPhone: Share → Add to Home Screen to play full screen.</div>
</div>

<div id="creator"><div class="card paper">
  <h2>Who are you?</h2>
  <div class="cwrap">
    <canvas id="cPrev" width="128" height="136"></canvas>
    <div class="cfields">
      <label>Your name<input id="cName" maxlength="14" autocomplete="off" autocapitalize="words" placeholder="Name"></label>
      <label>Farm name<input id="cFarm" maxlength="18" autocomplete="off" autocapitalize="words" placeholder="e.g. Olive Hill"></label>
    </div>
  </div>
  <div class="crow"><span>Hair</span><button class="arrow" id="cHairL">◀</button><b id="cHairName"></b><button class="arrow" id="cHairR">▶</button></div>
  <div class="crow"><span>Hair color</span><div class="sws" id="cHairCol"></div></div>
  <div class="crow"><span>Skin</span><div class="sws" id="cSkin"></div></div>
  <div class="crow"><span>Tunic</span><div class="sws" id="cShirt"></div></div>
  <div class="crow"><span>Trousers</span><div class="sws" id="cPants"></div></div>
  <div class="cbtns"><button class="btn alt" id="cRandom">Random</button><button class="btn" id="cStart">Start farming</button></div>
</div></div>

<div id="fade"></div>
<div id="night"><div class="stars"></div><div class="nwrap"><div class="moon"></div><div class="n1"></div><div class="n2"></div><div class="n3"></div><button class="btn" id="nGo">Good morning ☀</button></div></div>

<script src="js/core.js"></script>
<script src="js/character.js"></script>
<script src="js/world.js"></script>
<script src="js/farming.js"></script>
<script src="js/npc.js"></script>
<script src="js/town.js"></script>
<script src="js/interior.js"></script>
<script src="js/jordan.js"></script>
<script src="js/sinai.js"></script>
<script src="js/caves.js"></script>
<script src="js/craft.js"></script>
<script src="js/more.js"></script>
<script src="js/game.js"></script>
</body>
</html>
